<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="slate-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1f232d"/>
      <stop offset="60%" stop-color="#15171e"/>
      <stop offset="100%" stop-color="#0e1015"/>
    </radialGradient>
    <linearGradient id="paw-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90e2"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1c71d8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#slate-bg)"/>

  <!-- Minimal Decorative Rings -->
  <circle cx="960" cy="510" r="260" fill="none" stroke="#252a36" stroke-width="2"/>
  <circle cx="960" cy="510" r="380" fill="none" stroke="#1d212b" stroke-width="1.5" stroke-dasharray="4 8"/>

  <!-- Center Leopard Paw -->
  <g transform="translate(960, 490) scale(2.2)" filter="url(#glow-filter)">
    <!-- Paw Pad -->
    <path d="M -16 12 C -16 2, -9 0, 0 0 C 9 0, 16 2, 16 12 C 16 22, 9 28, 0 28 C -9 28, -16 22, -16 12 Z" fill="url(#paw-metal)"/>
    
    <!-- Paw Toes -->
    <ellipse cx="-19" cy="-6" rx="5.5" ry="8" transform="rotate(-20 -19 -6)" fill="url(#paw-metal)"/>
    <ellipse cx="-7.5" cy="-12" rx="5.5" ry="8.5" transform="rotate(-6 -7.5 -12)" fill="url(#paw-metal)"/>
    <ellipse cx="7.5" cy="-12" rx="5.5" ry="8.5" transform="rotate(6 7.5 -12)" fill="url(#paw-metal)"/>
    <ellipse cx="19" cy="-6" rx="5.5" ry="8" transform="rotate(20 19 -6)" fill="url(#paw-metal)"/>

    <path d="M 23 -22 Q 23 -16 29 -16 Q 23 -16 23 -10 Q 23 -16 17 -16 Q 23 -16 23 -22 Z" fill="#62a0ea"/>
  </g>

  <text x="960" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#8892b0" text-anchor="middle" letter-spacing="6">PARS LINUX</text>
</svg>
