<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="aurora-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f5fc"/>
      <stop offset="50%" stop-color="#e3edf9"/>
      <stop offset="100%" stop-color="#d8e6f7"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3584e4" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#62a0ea" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#99c1f1" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="wave2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1c71d8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3584e4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#62a0ea" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="light-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1c71d8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clean Base -->
  <rect width="1920" height="1080" fill="url(#aurora-bg)"/>
  
  <!-- Soft Glow -->
  <circle cx="960" cy="450" r="500" fill="url(#sun-glow)"/>

  <!-- Fluid Aurora Waves -->
  <path d="M 0 650 C 350 500, 700 800, 1100 600 C 1500 400, 1750 700, 1920 580 L 1920 1080 L 0 1080 Z" fill="url(#wave1)"/>
  <path d="M 0 780 C 400 700, 800 900, 1200 720 C 1600 550, 1800 850, 1920 750 L 1920 1080 L 0 1080 Z" fill="url(#wave2)"/>

  <!-- Center Leopard Paw Symbol Group -->
  <g transform="translate(960, 440) scale(2.4)" filter="url(#light-shadow)">
    <!-- Base Icon Container -->
    <rect x="-42" y="-42" width="84" height="84" rx="20" fill="#ffffff" stroke="#3584e4" stroke-width="1.5" stroke-opacity="0.3"/>
    
    <!-- Paw Pad -->
    <path d="M -15 11 C -15 2, -8 0, 0 0 C 8 0, 15 2, 15 11 C 15 20, 8 26, 0 26 C -8 26, -15 20, -15 11 Z" fill="#1c71d8"/>
    
    <!-- Paw Toes -->
    <ellipse cx="-18" cy="-5" rx="5" ry="7.5" transform="rotate(-20 -18 -5)" fill="#1c71d8"/>
    <ellipse cx="-7" cy="-11" rx="5" ry="8" transform="rotate(-6 -7 -11)" fill="#1c71d8"/>
    <ellipse cx="7" cy="-11" rx="5" ry="8" transform="rotate(6 7 -11)" fill="#1c71d8"/>
    <ellipse cx="18" cy="-5" rx="5" ry="7.5" transform="rotate(20 18 -5)" fill="#1c71d8"/>

    <!-- Small Sparkle -->
    <path d="M 22 -22 Q 22 -16 28 -16 Q 22 -16 22 -10 Q 22 -16 16 -16 Q 22 -16 22 -22 Z" fill="#e5a50a"/>
  </g>

  <!-- Brand Typography -->
  <text x="960" y="620" font-family="system-ui, -apple-system, Cantarell, sans-serif" font-size="28" font-weight="600" fill="#1c71d8" opacity="0.9" text-anchor="middle" letter-spacing="4">PARS LINUX</text>
  <text x="960" y="650" font-family="system-ui, -apple-system, Cantarell, sans-serif" font-size="14" font-weight="500" fill="#3584e4" opacity="0.8" text-anchor="middle" letter-spacing="6">MODERN • FAST • SECURE</text>
</svg>
