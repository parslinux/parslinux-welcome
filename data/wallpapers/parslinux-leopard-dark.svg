<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="ambient" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1f2d48"/>
      <stop offset="50%" stop-color="#131722"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1c71d8" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="48%" r="35%">
      <stop offset="0%" stop-color="#3584e4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3584e4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Deep Dark Base -->
  <rect width="1920" height="1080" fill="url(#ambient)"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="960" cy="500" r="600" fill="url(#center-glow)"/>

  <!-- Geometric Abstract Lines -->
  <g stroke="#3584e4" stroke-opacity="0.08" stroke-width="1.5" fill="none">
    <circle cx="960" cy="500" r="320"/>
    <circle cx="960" cy="500" r="440" stroke-dasharray="8 12"/>
    <circle cx="960" cy="500" r="560"/>
  </g>

  <!-- Center Leopard Paw Symbol Group -->
  <g transform="translate(960, 470) scale(2.6)" filter="url(#soft-shadow)">
    <!-- Base Icon Container -->
    <rect x="-44" y="-44" width="88" height="88" rx="22" fill="#1e2536" stroke="#3584e4" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Paw Pad -->
    <path d="M -16 12 C -16 2, -9 0, 0 0 C 9 0, 16 2, 16 12 C 16 22, 9 28, 0 28 C -9 28, -16 22, -16 12 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Paw Toes -->
    <ellipse cx="-19" cy="-6" rx="5.5" ry="8" transform="rotate(-20 -19 -6)" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="-7.5" cy="-12" rx="5.5" ry="8.5" transform="rotate(-6 -7.5 -12)" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="7.5" cy="-12" rx="5.5" ry="8.5" transform="rotate(6 7.5 -12)" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="19" cy="-6" rx="5.5" ry="8" transform="rotate(20 19 -6)" fill="#ffffff" opacity="0.95"/>

    <!-- Small Sparkle -->
    <path d="M 24 -24 Q 24 -18 30 -18 Q 24 -18 24 -12 Q 24 -18 18 -18 Q 24 -18 24 -24 Z" fill="#f9f06b" opacity="0.8"/>
  </g>

  <!-- Brand Typography -->
  <text x="960" y="660" font-family="system-ui, -apple-system, Cantarell, sans-serif" font-size="28" font-weight="600" fill="#ffffff" opacity="0.9" text-anchor="middle" letter-spacing="4">PARS LINUX</text>
  <text x="960" y="692" font-family="system-ui, -apple-system, Cantarell, sans-serif" font-size="14" font-weight="400" fill="#78aeed" opacity="0.7" text-anchor="middle" letter-spacing="6">MODERN • FAST • SECURE</text>
</svg>
