<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="paw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f5f4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg-grad)" filter="url(#shadow)"/>

  <!-- Subtle Inner Border -->
  <rect x="9" y="9" width="110" height="110" rx="27" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Sparkle / Welcome Star Top Right -->
  <path d="M 94 24 Q 94 34 104 34 Q 94 34 94 44 Q 94 34 84 34 Q 94 34 94 24 Z" fill="#f9f06b" opacity="0.9"/>
  <path d="M 32 30 Q 32 36 38 36 Q 32 36 32 42 Q 32 36 26 36 Q 32 36 32 30 Z" fill="#ffffff" opacity="0.6"/>

  <!-- Pars Leopard Paw / Welcome Hand Symbol -->
  <!-- Main Pad -->
  <path d="M 44 76 C 44 64, 52 62, 64 62 C 76 62, 84 64, 84 76 C 84 88, 76 96, 64 96 C 52 96, 44 88, 44 76 Z" fill="url(#paw-grad)" filter="url(#shadow)"/>
  
  <!-- Toe 1 -->
  <ellipse cx="40" cy="54" rx="7" ry="10" transform="rotate(-20 40 54)" fill="url(#paw-grad)"/>
  <!-- Toe 2 -->
  <ellipse cx="54" cy="46" rx="7" ry="11" transform="rotate(-6 54 46)" fill="url(#paw-grad)"/>
  <!-- Toe 3 -->
  <ellipse cx="74" cy="46" rx="7" ry="11" transform="rotate(6 74 46)" fill="url(#paw-grad)"/>
  <!-- Toe 4 -->
  <ellipse cx="88" cy="54" rx="7" ry="10" transform="rotate(20 88 54)" fill="url(#paw-grad)"/>
</svg>
